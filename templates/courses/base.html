<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Course Builder{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7fb; }
    .app-shell { padding-bottom: 7.5rem; }
    .rag-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1040;
      background: #0f172a;
      color: #fff;
      box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.18);
    }
    .rag-answer {
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .lesson-body { white-space: pre-wrap; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'home' %}">PDF Course Studio</a>
    </div>
  </nav>
  <main class="container py-4 app-shell">
    {% block content %}{% endblock %}
  </main>
  {% block rag %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
