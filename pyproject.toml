[project]
name = "course-builder"
version = "0.1.0"
description = "Django app that builds courses from PDFs with LangChain, FAISS, and Groq"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-groq>=0.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[tool.uv]
package = false
